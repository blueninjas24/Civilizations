# Construction budget prototype. Money is in hundredths of an emerald: 100 = 1 emerald.
# These limits protect actual charges; automatic home construction is controlled separately below.
# Existing materials are not charged again. Future purchases must pay a real supplier.
# No separate construction wage/personal-wallet system is introduced.
format: 1
land:
  # Avoid nearby buildings, crops, fences, trees, water and unknown obstacles in this many blocks.
  # This is a bounded visual heuristic: unmarked empty player fields are indistinguishable.
  # Confirmed fenced plots remain protected, including empty plots.
  building-buffer: 4
labor:
  # Actual eligible effort is booked through the simulation owner; unused effort is never invented.
  # Village work uses unemployed adults; businesses use only their own qualified staff.
  # Construction replaces some normal work; it never creates extra effort or changes permanent jobs.
  enabled: true
  village-workers: 2
  business-workers: 1
  effort-per-worker: 100
  business-share-percent: 25
business:
  enabled: true
  # Preserve operating cash plus the larger of upkeep reserve and known essential obligations.
  minimum-cash: 500
  food-reserve-periods: 0
  cash-per-food-unit: 200
  essential-upkeep-reserve: 500
  maximum-purchase: 10000
  per-period-limit: 20000
  purposes: [storage, workshop, dock]
village:
  enabled: true
  # Protect max(minimum cash, demand * food periods * price), PLUS essential upkeep.
  # Existing committed obligations are protected in addition to these amounts.
  minimum-cash: 2500
  food-reserve-periods: 2
  cash-per-food-unit: 200
  essential-upkeep-reserve: 1000
  maximum-purchase: 5000
  per-period-limit: 5000
  purposes: [home, path]

# Whole-household planning only; this does not enable building or spend funds.
# Reuse verified village-owned vacancies first; incomplete surveys block new homes.
housing:
  maximum-new-proposals: 1

# Prepare at most a small number of unused home plans beside existing paths.
# This reserves a clear site and family proposal; it buys nothing and places no blocks.
# Existing construction.yml files opt in by adding this entire section explicitly.
# Admins inspect /civ build projects and can confirm unused cancellation.
automatic-home-planning:
  enabled: true
  cells-per-tick: 128
  review-seconds: 30
  maximum-active-homes: 1
  search-radius: 12

# Build saved family home projects with real suppliers, delayed cargo and earned labor.
# Existing files MUST explicitly add this entire section; they are never rewritten.
# New installations enable this prototype. Disable to pause future purchases/native steps.
# This does not enable private premises, civic buildings, terrain clearing or roads.
automatic-construction:
  enabled: true
  # Shared survey budget. The separate atomic final-write check is capped at256 reads.
  cells-per-tick: 128
  # Waiting projects retry after this delay; successful work rotates through all projects sooner.
  review-seconds: 10
  # Global minimum gap between native step attempts, in real milliseconds (500 = half a second).
  block-interval-ms: 500

# Reference prices per actual unit, in the existing hundredths ledger. No goods seeded.
# Uses existing industry local-delivery periods and shared haul limits/cadence.
# Automatic home projects use these real supplier prices; unavailable goods hold the whole purchase.
supplies:
  enabled: true
  prices:
    stone: 25
    timber: 40
    wool: 100
    storage_fittings: 200
