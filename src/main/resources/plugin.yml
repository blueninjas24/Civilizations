name: Civilizations
version: '0.0.1'
main: com.blueninjas24.civilizations.Civilizations
api-version: '1.21'
author: Blueninjas24
description: Evolving, autonomous civilizations for Minecraft.
commands:
  civ:
    description: Read-only Civilizations population diagnostics.
    usage: /civ debug status | observation | settlement <uuid> | explain <uuid> | economy <uuid>
    permission: civilizations.debug
permissions:
  civilizations.debug:
    description: Inspect saved Civilizations population and calendar state.
    default: op
