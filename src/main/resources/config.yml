# Editable prototype settings, not balanced survival defaults.
# A year lasts six real minutes. Existing saves reject changes to the seed,
# calendar cadence and population/migration rules; no silent replay transition.
population:
  seed: 872613
  millis-per-month: 30000
  # Legacy headless harness cap only. Live Paper ALWAYS pauses during downtime.
  maximum-offline-months: 12
  months-per-batch: 2
  months-per-year: 12
  adulthood-months: 216
  parent-minimum-months: 240
  parent-maximum-months: 480
  senior-months: 720
  birth-chance: 0.015
  background-death-chance: 0.0001
  senior-death-increase-per-year: 0.0005
  household-move-chance: 0.02
  external-arrival-chance: 0.005
recognition:
  connection-radius: 32
  resident-radius: 32
  minimum-beds: 2
  minimum-villagers: 2
  maximum-beds: 512
  maximum-villagers: 256
enrollment:
  home-bed-radius: 8
  residents-per-bed: 2
  initial-adult-months: 240
  initial-child-months: 0
  form-partnerships: true
  partnership-minimum-months: 216
observer:
  radius-chunks: 4
  block-reads-per-tick: 4096
  nanos-per-tick: 2000000
  refresh-ticks: 100
projection:
  nearby-radius: 64
  maximum-per-world: 32
  maximum-at-night: 8
  chunks-per-tick: 2
  residents-per-tick: 16
# Explicit protection only; does not enable livestock adoption or building claims.
# Unknown existing pens require civilizations.pen.admin (operators by default).
pen-protection:
  enabled: true
  radius: 32
  maximum-area: 1024
  chunks-per-tick: 2
  cells-per-tick: 64
  maximum-animals: 128
  maximum-requests: 8
  preview-seconds: 60
