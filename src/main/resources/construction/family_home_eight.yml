# Original Civilizations 8-bed family home. Tall rooms keep light fittings above headroom.
# Fixture timber covers sticks/charcoal and assembly under the same abstract real-material budget.
format: 1
id: family_home_eight
revision: 1
name: 8-bed village family home
attribution: Original Civilizations starter build
purpose: home
size: {x: 7, y: 5, z: 6}
palette:
  C: minecraft:cobblestone
  P: minecraft:oak_planks
  L: minecraft:oak_log[axis=y]
  D: minecraft:oak_door[facing=north,half=lower,hinge=left,open=false,powered=false]
  U: minecraft:oak_door[facing=north,half=upper,hinge=left,open=false,powered=false]
  F: minecraft:white_bed[facing=west,occupied=false,part=foot]
  H: minecraft:white_bed[facing=west,occupied=false,part=head]
  I: minecraft:white_bed[facing=east,occupied=false,part=foot]
  J: minecraft:white_bed[facing=east,occupied=false,part=head]
  T: minecraft:wall_torch[facing=north]
stages:
  - id: foundation
    work: 42
    materials: {stone: 14}
    layers:
      - y: 0
        rows: [CCCCCCC, CCCCCCC, CCCCCCC, CCCCCCC, CCCCCCC, CCCCCCC]
  - id: walls
    work: 66
    materials: {timber: 22}
    layers:
      - y: 1
        rows: [LPPDPPL, P.....P, P.....P, P.....P, P.....P, LPPPPPL]
      - y: 2
        rows: [LPPUPPL, P.....P, P.....P, P.....P, P.....P, LPPPPPL]
      - y: 3
        rows: [LPPPPPL, P.....P, P.....P, P.....P, P.....P, LPPPPPL]
