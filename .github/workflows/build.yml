name: Build and persistence tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Small feature backups must not repeatedly cancel the slower Windows migration run.
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Full transactional migration coverage is slower on hosted Windows disks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
      - name: Verify on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Summarize test failures
        if: failure()
        shell: pwsh
        run: |
          # Publish only source-verified class names and counts, never fixture values/messages.
          $reports = Get-ChildItem target/surefire-reports/TEST-*.xml, target/failsafe-reports/TEST-*.xml -ErrorAction SilentlyContinue
          $shown = 0
          foreach ($report in $reports) {
            [xml]$suite = Get-Content -LiteralPath $report.FullName -Raw
            $suiteName = [string]$suite.testsuite.name
            if ($suiteName -notmatch '^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$') { continue }
            $sourceFile = 'src/test/java/' + $suiteName.Replace('.', '/') + '.java'
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) { continue }
            $failures = [int]$suite.testsuite.failures
            $errors = [int]$suite.testsuite.errors
            if ($failures + $errors -eq 0 -or $shown -ge 20) { continue }
            Write-Output "::error title=JUnit suite failed::${suiteName}: $failures failures; $errors errors. Reproduce this class locally for details."
            $shown++
          }
          if ($shown -eq 0) { Write-Output 'No source-verified JUnit failure summary available; inspect the preceding build step.' }
