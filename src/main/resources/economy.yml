# Civilizations experimental economy settings (not final game balance).
# On a server: plugins/Civilizations/economy.yml
# Keep indentation: two spaces. Use numbers without quotes and % signs.
# Edit while stopped, then restart. This file is never overwritten automatically.
# Live food accounting uses planted fields and saved residents. Optional village
# food purchases and bargaining pay emeralds; barter exchanges real saved supplies.
# Starvation effects are not enabled.
format-version: 1

# Prices and money budgets are hundredths of an emerald. Real owned goods only.
# Food customers require recorded shortages; materials require active practice needs.
# Incoming cargo cannot be used before its due food period. Older files opt out.
village-supply-purchases:
  enabled: true
  food-budget-per-period: 2000
  material-budget-per-period: 1000
  minimum-treasury: 2500
  food-reserve-periods: 2
  delivery-periods: 1
  haul-units-per-period: 32
  prices:
    food: 200
    stone: 100
    timber: 150

# One paid recipe bundle for a new publicly funded workshop, not ongoing supply.
# Uses prices.base-trade-value below. Food is never sold by this rule.
# Leave this many units of EVERY purchased material for public/training needs.
# Old files without this section keep this feature disabled.
# Automatic first-workshop founding is connected separately; this is its policy.
workshop-starter-supplies:
  enabled: true
  maximum-recipe-batches: 1
  maximum-purchase-hundredths: 4000
  protected-units-per-material: 2

# Read-only first-tool-workshop investment checks; automatic founding remains separate.
# Requires current smithing-table evidence, a real funded farm toolkit need,
# protected startup funds and the paid surplus bundle above. No land ownership.
workshop-opportunities:
  enabled: true
  markers-per-review: 8
  evidence-lifetime-millis: 60000
  horizontal-range: 96
  vertical-range: 48
  startup-hundredths: 500
  capital-hundredths: 4000
  storage-capacity: 1024

# Public farm equipment invoices; actual treasury, food protection and saved budget.
# Food still goes straight into village supplies; no private farm cash or paid food sale.
# One actual toolkit per invoice; recurring cap is separate from startup grants.
farm-tools:
  enabled: true
  startup-grace-periods: 3
  work-periods-per-tool: 8
  missing-tools-output-percent: 50
  suppliers-per-review: 8

farm-tool-budget:
  enabled: true
  tool-trade-value-hundredths: 4000
  per-period-limit-hundredths: 4000
  minimum-treasury-hundredths: 2500
  food-reserve-periods: 2
  food-unit-value-hundredths: 200

# EXISTING firms fill real vacancies with qualified, unemployed local residents.
# Living local owner required; deceased owners' firms retain existing staff only.
# No poaching, free skills, wage wallets or new businesses. Farms use their own adapter.
# Candidate pages rotate; these budgets constrain work per firm review, not ownership.
# Missing old sections stay disabled; edit while stopped and restart to opt in.
automatic-business-staffing:
  enabled: true
  candidates-per-review: 64
  hires-per-review: 2
  industries: [mining, blacksmith, warehouse]

# Limited public startup funding for qualified mines/workshops/warehouses. Trusted startup
# accounting is implemented; automatic founding/selection is still being connected.
# These limits spend real village money, never grant personal wallets or wages.
# 100 hundredths = 1 Trade Value. Startup cost AND working capital count together.
# Per-period means the village food/economic period; lifetime does not reset on restart.
# Keep max(minimum treasury, last food demand * reserve periods * cost per unit).
# The food-unit cost is a conservative budget estimate, NOT a merchant price.
# Missing/currently unmet food assessment blocks funding, even with ample money.
# Missing old sections remain disabled; edit while stopped, then restart.
startup-grants:
  enabled: true
  maximum-grant-hundredths: 5000
  per-period-limit-hundredths: 5000
  lifetime-limit-hundredths: 20000
  minimum-treasury-hundredths: 2500
  food-reserve-periods: 2
  hundredths-per-food-unit: 200
  # All listed industries share the SAME period/lifetime caps above.
  # Eligibility alone does not create a business or certify resource evidence.
  industries: [mining, blacksmith, warehouse, logging, fishing, quarry, sandpit]

fishing-resources:
  # Saved-resource timers are connected; automatic water observation/founding remain unfinished.
  # A column must represent distinct, suitable open water in a complete observation.
  enabled: true
  minimum-water-columns: 16
  stock-per-water-column: 8
  maximum-stock: 4096
  initial-stock-percent: 75
  # 200 basis points = 2% of saved capacity restored per earned industry period.
  # Zero permits an admin's non-recovering/famine experiment. No offline recovery.
  recovery-basis-points: 200
  catch-per-worker: 4
  site-catch-capacity: 16

quarry-resources:
  # Opening/extraction terms for the finite backend. Automatic founding is not connected yet.
  # Abundance and work speed are independent; existing reserves/yields stay saved.
  enabled: true
  stone:
    reserve-batches-per-block: 64
    units-per-batch: 3
    batches-per-worker: 6
    site-batch-capacity: 32
  sand:
    reserve-batches-per-block: 64
    units-per-batch: 4
    batches-per-worker: 12
    site-batch-capacity: 32

# Qualified EXISTING employees may keep working after an owner's death while the
# business awaits succession/resale. No promotion, hiring authority, grants or wages.
# Real supplies, finite deposits, storage and online-world limits still apply.
# Set continue-staffed-after-owner-death false to pause until a living local owner.
# enabled false/missing old section retains legacy behavior (mines pause, farms continue).
business-operations:
  enabled: true
  continue-staffed-after-owner-death: true

# Limits for the paid business-resale backend; automatic listing/buyers are upcoming.
# Buyers must qualify and own the funding business or belong to the saved estate family.
# 1000 hundredths = 10.00 Trade Value kept in the buyer's business for operations.
# Each purchase may use at most 25% of cash ABOVE this floor and 100% of estate cash.
# Set both percentages to 0 to forbid new purchases. No grants or personal wallets.
# Existing files without this complete section disable new purchases; accepted history remains.
business-resale-funding:
  minimum-retained-business-cash-hundredths: 1000
  maximum-spare-business-percent: 25
  maximum-estate-percent: 100

# Read-only exposed coal/iron evidence around each saved home anchor.
# No mining, block ownership or automatic businesses are enabled by this setting.
# Existing files without this section opt in explicitly; no file rewrite on upgrade.
# Unknown border evidence is discarded; unloaded chunks are never forced to load.
ore-observer:
  enabled: true
  horizontal-radius-chunks: 1  # 0..2; 0 keeps only the home chunk. Never loads chunks.
  vertical-radius: 24
  cells-per-tick: 512
  interval-ticks: 400

# Recipes for existing timed workshops; does not create workshops automatically.
# Abstract commodity units, not individual Minecraft swords/pickaxes or player trades.
# Real delivered inputs + saved qualified workers + matching business/store required.
# The store must support every input/output with positive storage-space-per-unit.
# Inputs, outputs and work rates may be tuned; saved production history is immutable.
# Timed work and automatic input purchases require their separate settings below.
recipes:
  smith_tools:
    industry: blacksmith
    inputs:
      iron: 2
      coal: 1
    outputs:
      tools: 1
    batches-per-worker: 2
    site-batch-capacity: 8

# First automatic Phase 3 enterprise: one village-wide field business.
# Complete observed crops + free qualified adults + actual village funds required.
# No block ownership, harvesting or building. Food output REPLACES legacy field output.
# Workers also cannot hold another primary business job. No extra production/money.
# Older files without this section retain legacy food; add the complete section to opt in.
# Existing firm's capacity/requirements/startup terms are retained after edits.
# 2500 hundredths = 25.00 abstract Trade Value, charged once at founding.
farm-businesses:
  enabled: true
  worker-capacity: 4
  startup-trade-value-hundredths: 2500
  minimum-age-months: 216
  minimum-farming-experience: 0

# Actual timed mining/workshop output can teach existing qualified employees.
# Gain is per productive period, not per item; zero output gives no experience.
# Warehouses learn commerce once per period with actual new paid upstream orders.
# Sales/delivery alone do not yet award experience. No automatic career enrollment.
# Missing old sections keep learning disabled. Edit stopped/restart; past awards
# and skills are retained. Lowering the ceiling never takes earned skills away.
# Removing an industry disables its future learning. This does not train unemployed
# residents, grant money, create workers or waive founder requirements.
work-learning:
  enabled: true
  experience-per-productive-period: 1
  maximum-experience: 100
  maximum-workers-per-review: 64
  industry-skills:
    mining: mining
    blacksmith: smithing
    farming: farming
    warehouse: commerce

# Phase 3 finite mining backend. Timed work runs existing mines; auto founding is pending.
# Minerals are ALWAYS finite: no regeneration, infinite-deposit or refill option.
# An observed ore block is deposit evidence, not one item. At discovery only:
# initial extraction bundles = observed ore count * deposit-batches-per-observed-ore.
# Saved deposits and stores never reset from a restart/config edit.
# One bundle shares mining labor and produces ALL listed goods together.
# Prototype coal seam: three miners produce up to 24 coal + 72 stone/period,
# bounded by remaining deposit, site capacity and storage. These are tunable examples.
# Customize rock types with commodity keys such as andesite/cobbled_deepslate and
# give every output a storage-space-per-unit entry. Values are abstract units, not blocks.
industry:
  deposit-batches-per-observed-ore: 150
  batches-per-worker: 8
  site-batch-capacity: 32
  storage-capacity: 1024
  local-delivery-periods: 1
  local-haul-units-per-period: 128
  mining-bundle:
    coal: 1
    stone: 3
  storage-space-per-unit:
    coal: 1
    stone: 1
    iron: 1
    timber: 2
    food: 1
    tools: 1

# /civ barter timber (or stone) requests a quote for the whole held food stack.
# /civ barter accept explicitly confirms it; saved inventory proof gates the exchange.
# Prototype outgoing goods use real saved opening supplies, not new industry production.
# Remove a goods entry to disallow it. Only timber/OAK_LOG and stone/COBBLESTONE supported.
# Whole items floor to current Trade Value; keep-units protects that commodity's stock.
# Food target 1..100 periods; maximum-items 1..64; units-per-item 1..1000000;
# keep-units 0..1000000000. Edit while stopped and restart.
barter:
  enabled: true
  food-reserve-periods: 3
  maximum-items: 64
  goods:
    timber:
      item: OAK_LOG
      units-per-item: 1
      keep-units: 2
    stone:
      item: COBBLESTONE
      units-per-item: 1
      keep-units: 2

# Players can ask a food price with /civ bargain <emeralds>, then /civ bargain accept.
# Each proposal uses current need/value/funds. Nothing exchanges until acceptance.
# Excessive prices receive counters; consecutive failed prices eventually close the deal.
# Closing/reopening menus or reconnecting cannot erase the saved village cooldown.
# No reputation penalty. Old files missing this section keep bargaining disabled.
# Attempts: 1..100; cooldown: 1..86400 seconds; offer validity: 1..3600 seconds.
# Edit while stopped, restart. Pending verified purchases still recover if disabled.
bargaining:
  enabled: true
  maximum-failed-offers: 3
  cooldown-seconds: 60
  offer-seconds: 45

# Basic family wellbeing, not money or a personal bank account. No population penalties.
# New people start at 50/100; families share the mean of their saved welfare scores.
# Their actual food/housing then changes that score. Moves retain the people's history.
# Recovery requires supplied food AND known sufficient housing. Unknown is not zero.
# Food crisis uses shortages.severe-after-periods; crowding adds its own penalty.
# All values: 0..100; crisis penalty must be at least shortage penalty.
# Existing residents' scores never reset on retuning, restart or migration.
# Old files without this section keep the assessment disabled; add it to opt in.
wellbeing:
  enabled: true
  starting-score: 50
  recovery-per-period: 1
  food-shortage-penalty: 3
  food-crisis-penalty: 5
  crowding-penalty: 1

# Starting spending capacity, NOT emerald items or individual salaries.
# New economies receive this amount per living resident ONCE. Enabling this on an
# existing server also opens accounts for active economies that have NO treasury.
# Existing accounts (even empty ones) never refill. Births/migration/restarts do not
# add grants. Disabling stops new grants; it does not erase existing money.
# 24 Trade Value is about six adult food periods at the default balanced food price.
# This is experimental initial capital, not ongoing business revenue.
# Valid amount: 0..1000000, at most two decimal places; 0 creates a recorded zero account.
# Old files without this entire section keep grants disabled. Add it to opt in.
finance:
  opening-funds-enabled: true
  opening-trade-value-per-resident: 24

# Village food purchases, separate from free donations. Sneak-right-click, then Sell.
# Ordinary vanilla trading is unchanged. Old files without this section keep sales off.
# Villages buy only when seeking food, with reliable reports and actual funds.
# Whole confirmed held stacks only: split a large stack if it exceeds remaining need.
# Payment replaces the consumed stack in the main-hand slot; never drops overflow.
# The market value rounds DOWN to whole emeralds. Only actual payment debits funds.
# Disabling new sales still permits pending-trade recovery at its original saved rate.
purchases:
  enabled: true
  trade-value-per-emerald: 8     # 0.01..1000000, up to two decimal places.
  food-reserve-periods: 3       # Buy toward this many demand periods (1..100).
  maximum-emeralds: 64          # Per whole-stack deal (1..64).

# Nonbinding priorities: seek food, investigate crowded homes, or monitor.
# Buying settings are separate; building remains in Phase 4. Review when pressure changes.
# These weights bias seeded choices among feasible, reasonably competitive priorities.
# Old files may omit this whole section. Edits apply to future reviews; history is retained.
priorities:
  # Earlier verified deliveries can mildly reinforce seeking food when it is still needed.
  # Both zero disables. Otherwise window 1..100; maximum bonus 1..100 percent.
  # Old files without learning stay disabled. No penalties, payment changes or player rewards.
  learning:
    window-periods: 12
    maximum-food-bonus-percent: 25

  review-after-periods: 5
  food-weight: 10
  crisis-multiplier: 3
  housing-weight: 6
  monitor-weight: 1
  minimum-relative-percent: 25

# Published preference among feasible food responses. Players may choose alternatives.
# Existing files without this section keep it disabled. Weights 1..1000; threshold 0..100.
# Actual donations/purchases/barter still require their separate settings and consent.
responses:
  enabled: true
  donation-weight: 6
  emerald-weight: 4
  barter-weight: 4
  wait-weight: 1
  minimum-relative-percent: 25

# Economic periods are separate from population months. Consumption below is PER PERIOD.
# Changing only the speed makes BOTH consumption and production happen more often.
pace:
  seconds-per-period: 60
  maximum-offline-periods: 120  # Legacy headless cap only; live Paper pauses downtime.
  periods-per-batch: 2         # SQL-owner work budget, not a Paper tick deadline.

food:
  units-per-adult: 2
  units-per-child: 1
  units-per-worker: 4          # Only with an evidenced facility slot AND available adult labor.
  output-percent: 100          # 100 = normal; 25 = famine; 200 = feast; 0 = no output.

# Read-only crops on farmland near saved homes. These do not claim block ownership,
# harvest crops or grant building permission. Shared/ambiguous fields defer both towns.
# Older files may omit this whole section and receive these documented defaults.
farms:
  radius-blocks: 32
  vertical-radius-blocks: 16
  crops-per-worker: 16

# Coverage = (reserves + production + imports) / requested demand.
# Severe requires BOTH low coverage and this many consecutive deficit periods.
# Full supply clears the duration counter. No automatic starvation deaths are enabled.
shortages:
  severe-coverage-percent: 50
  severe-after-periods: 3
  surplus-coverage-percent: 125
  abundant-coverage-percent: 200

# Explicit first enrollment only. Never replenishes an existing inventory on restart.
# Abstract commodity units, not items removed from Minecraft chests.
# Food 12 gives a new adult about six periods of reserves without production.
starting-units-per-resident:
  food: 12
  timber: 4
  stone: 4
  iron: 1
  coal: 1
  livestock_products: 0

# Abstract Trade Value, converted to whole emeralds or available barter goods in offers.
# Prices can have up to two decimal places. Commodity keys must match stocks above.
prices:
  base-trade-value:
    food: 2
    timber: 4
    stone: 3
    iron: 12
    coal: 6
    livestock_products: 5
  condition-percent:
    severe-shortage: 250
    shortage: 150
    balanced: 100
    surplus: 85
    abundant: 70

# FAMINE EXAMPLE: output-percent: 25 (or units-per-adult: 3).
# FEAST EXAMPLE: output-percent: 200 (or units-per-adult: 1).
# Keep 100 for ordinary play until tuning. These examples need real production capacity;
# a multiplier cannot conjure farms. Whole food output rounds down each period.
# Restart tuning records a forward transition, skips the offline interval at that
# change, and preserves past explanations. Finish queued catch-up before retuning.

# Read-only /civ aid preview. No items are removed or payments/reputation awarded.
# Defaults apply to an existing format-1 file if this entire section is absent.
# Only these six ordinary plant foods are currently supported; omit a key to disable it.
# Whole food units per item, 1..1000000. Radius is 1..128 blocks in the same world.
aid-preview:
  enabled: true
  radius-blocks: 32
  units-per-item:
    WHEAT: 1
    BREAD: 3
    CARROT: 1
    POTATO: 1
    BAKED_POTATO: 2
    BEETROOT: 1

# Sneak-right-click a managed villager with plain food, then click Donate held food.
# No payment or reputation reward. Recovery receipts are verified in saved player data.
# Existing owner files without this section keep donations disabled until opted in.
donations:
  enabled: true

# Unsupported bulk editors pause new ore discovery, retaining saved deposits/history.
# WorldEdit, FastAsyncWorldEdit and VoxelSniper are always guarded. Add other plugin
# descriptor names here; this cannot certify unknown editors or offline world edits.
# Removing/disabling an editor does not repair missing provenance automatically.
ore-provenance:
  additional-bulk-editor-plugins: []

# Timed operation of existing funded/staffed mines and workshops. This does not
# found firms. Missing old sections remain disabled until opted in.
# Online worlds earn time even with unloaded chunks; server/world absence pauses.
# At most this many firms complete one earned period each per SQL-owner pulse.
industry-runtime:
  enabled: true
  real-millis-per-period: 30000
  businesses-per-pulse: 8

# Existing workshops buy actual recipe inputs from local owned warehouse stock.
# Uses prices.base-trade-value above; paid cargo arrives after local-delivery-periods.
# No new money or suppliers. Larger buffers still require funds, labor and space.
# Missing old sections remain disabled; paid automatic cargo still arrives.
industry-supply:
  enabled: true
  input-periods: 2
  warehouses-per-review: 16

# Existing staffed warehouses buy actual extracted mine goods for funded workshop
# input needs. Uses the same base prices, cargo delay and shared hauling quota.
# No grant, automatic warehouse founding, markup or imaginary finished-goods buyers.
# Older files opt in by adding this section; paid cargo survives later disable.
warehouse-supply:
  enabled: true
  customers-per-review: 16
  producers-per-review: 16

# An abstract tool kit supports eight PRODUCTIVE timed periods at a firm.
# First three productive periods are grace; no wear during downtime/idle work.
# Without tools work runs at 50%, retaining fractional work for small businesses.
# Replacements spend BUSINESS cash. 4000 hundredths = 40 Trade Value on both legs.
# This tool value is separate from village opening stocks; it creates no free tools.
# Missing old sections stay disabled. Retained stores need existing tools support;
# their saved catalogs are never silently rewritten. Farms are not connected yet.
business-tools:
  enabled: true
  startup-grace-periods: 3
  work-periods-per-tool: 8
  missing-tools-output-percent: 50
  tool-value-hundredths: 4000
  industries: [mining, blacksmith]

# Gradual practice by unemployed adults selected for actual opportunities.
# Courses are persistent; actual vacancies and viable first-owner prospects sponsor study.
# Real village supplies are consumed per successful study period; food comes first.
# Missing old sections leave study disabled. Edit while stopped, then restart.
resident-study:
  enabled: true
  gain-per-period: 1
  maximum-experience: 100
  students-per-period: 2
  active-courses-per-village: 8
  food-reserve-periods: 1
  material-reserve-units: 2
  skills:
    mining:
      target-experience: 10
      practice-supplies:
        stone: 1
        timber: 1
    commerce:
      target-experience: 10
      practice-supplies:
        timber: 1
    smithing:
      target-experience: 10
      practice-supplies:
        stone: 1
        timber: 1

# Qualified family/employee inheritance always precedes sale.
# No ownership cap: a villager may buy multiple firms using actual funds.
# Candidate search rotates across saved pages; this is a CPU budget, not a population cap.
# Price = max(minimum site value, startup recovery) + owned cash + paid pending cargo
#         + currently owned stock value. Undiscovered/unextracted geology is not cash.
# Accepted prices/deadlines never reset after tuning. Old files explicitly opt in.
automatic-business-resale:
  enabled: true
  minimum-site-value-hundredths: 1000
  startup-recovery-percent: 50
  sale-deadline-seconds: 600
  buyers-per-review: 32
  stock-value-hundredths-per-unit:
    food: 200
    timber: 150
    stone: 100
    iron: 500
    coal: 200
    livestock_products: 300
    tools: 800

# Only the cash shortage for a verified public farm toolkit invoice is funded.
# Supplier keeps its original village-funded capital PLUS this operating reserve.
# No collection while village funds suffice; no household wallets or minted cash.
# Missing section in existing owner files disables new contributions.
upkeep-contributions:
  enabled: true
  operating-reserve-hundredths: 8000
  spare-cash-percent: 50
  per-business-period-limit-hundredths: 4000
  per-village-period-limit-hundredths: 4000

# Train only for real vacancies at existing living-owner firms, never fake employers.
# One saved review per business/food period; qualified residents use normal hiring.
# Existing files opt in; accepted courses retain terms and spend actual practice goods.
# Courses cancel if their linked job disappears. Automatic first founders are separate.
automatic-career-study:
  enabled: true
  candidates-per-review: 64
  enrollments-per-review: 1
  industries: [mining, blacksmith, warehouse]

# Starts data-only coal/iron mines for current funded workshop needs, not fake buyers.
# Requires current trusted exposed ore, a staffed affordable warehouse buyer, real
# founder experience and protected shared startup grants. No digging/building/chunk loads.
# Existing viable stock/extraction capacity suppresses redundant mines.
# Supply-backed first mining-owner study is connected; broader industry founding is separate.
# Per-resource output replaces coal/iron in industry.mining-bundle; its other
# configured byproducts remain. Deposits save terms once; edits never refill old ore.
automatic-mines:
  enabled: true
  settlements-per-pulse: 2
  patches-per-review: 8
  founders-per-review: 64
  survey-lifetime-seconds: 60
  horizontal-range: 96
  vertical-range: 48
  minimum-age-months: 216
  founder-mining-experience: 10
  worker-capacity: 2
  startup-hundredths: 500
  capital-hundredths: 2000
  mineral-yield-per-batch:
    coal: 2
    iron: 1

# Read-only existing markers around one saved home per village. Never opens an
# inventory, moves blocks or grants property rights. Current-block proof still gates startup.
# Legacy files without this section stay disabled; select either/both marker types.
workplace-observer:
  enabled: true
  vertical-radius: 16
  cells-per-tick: 512
  interval-ticks: 400
  horizontal-radius-chunks: 1
  markers: [barrel, smithing_table]

# Confirmed removal pauses newly marker-founded businesses. Unloaded blocks are unknown.
# Set false and restart to allow those firms to operate despite a missing marker.
workplace-operations:
  pause-on-missing: true

# First-workshop proposal/acceptance requirements. No free skill from a workstation.
# Gradual supply-backed founder study and bounded Paper startup are connected.
workshop-founding:
  enabled: true
  founders-per-review: 64
  minimum-age-months: 216
  founder-smithing-experience: 10
  worker-smithing-experience: 1
  worker-capacity: 2

# Read-only first mineral-chain warehouse prospects, not automatic warehouse startup.
# Requires real funded workshop gaps and current suitable coal/iron for every input.
# No stock, mine, money or property rights are created/reserved by this review.
warehouse-opportunities:
  enabled: true
  markers-per-review: 8
  evidence-lifetime-millis: 60000
  horizontal-range: 96
  vertical-range: 48
  startup-hundredths: 500
  capital-hundredths: 4000
  storage-capacity: 1024

# Qualification for the first mineral-chain warehouse. No free commerce experience.
# Enables qualified preparation/acceptance and ordinary automatic startup. Merchant
# training uses resident-study plus automatic-career-study, real available supplies,
# and a current fully fundable observed mineral-chain opportunity.
warehouse-founding:
  enabled: true
  founders-per-review: 64
  minimum-age-months: 216
  founder-commerce-experience: 10
  worker-commerce-experience: 1
  worker-capacity: 2
