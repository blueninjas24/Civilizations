name: Civilizations
version: '0.0.1'
main: com.blueninjas24.civilizations.Civilizations
api-version: '1.21'
author: Blueninjas24
description: Evolving, autonomous civilizations for Minecraft.
commands:
  civ:
    description: Civilizations food-aid previews and administrative diagnostics.
    usage: /civ aid [settlement UUID] or /civ debug status | observation | settlement <uuid> | explain <uuid> | economy <uuid>
permissions:
  civilizations.debug:
    description: Inspect saved Civilizations population and calendar state.
    default: op
  civilizations.aid.preview:
    description: Preview held food for a nearby village without transferring items.
    default: true
