    work: 42
    materials: {timber: 14}
    layers:
      - y: 4
        rows: [PPPPPPP, PPPPPPP, PPPPPPP, PPPPPPP, PPPPPPP, PPPPPPP]
  - id: beds
    work: 16
    materials: {timber: 16, wool: 24}
    layers:
      - y: 1
        rows: [......., .HF.IJ., .HF.IJ., .HF.IJ., .HF.IJ., .......]
  - id: fixtures
    work: 4
    materials: {timber: 1}
    layers:
      - y: 3
        rows: [......., ......., ......., ......., ...T..., .......]
anchors:
  - {role: entrance, at: [3, 1, 0], facing: north}
