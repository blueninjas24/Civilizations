name: Civilizations
version: '0.0.1'
main: com.blueninjas24.civilizations.Civilizations
api-version: '1.21'
softdepend: [WorldEdit]
author: Blueninjas24
description: Evolving, autonomous civilizations for Minecraft.
commands:
  civ:
    description: Civilizations pen protection, village food aid, bargaining, livestock market and administrative diagnostics.
    usage: /civ market or /civ aid [settlement UUID] or /civ bargain <emeralds|accept> [settlement UUID] or /civ barter <timber|stone|accept> [settlement UUID] or /civ debug status | observation | villages | resources | workforce <uuid> | settlement <uuid> | explain <uuid> | economy <uuid> | businesses <uuid> | recover-ore | recover-forest
permissions:
  civilizations.pen.admin:
    description: Explicitly resolve uncertain livestock pen ownership with preview and confirmation.
    default: op
  civilizations.pen.release:
    description: Release your own saved pen area after confirmation, retaining animal ownership and history.
    default: true
  civilizations.trade:
    description: Bargain and confirm village food sales and buy stocked livestock products.
    default: true
  civilizations.debug:
    description: Inspect Civilizations state and explicitly confirm scoped resource recovery.
    default: op
  civilizations.aid.preview:
    description: Preview held food for a nearby village without transferring items.
    default: true
  civilizations.aid.donate:
    description: Confirm food donations through the Civilizations village menu.
    default: true
