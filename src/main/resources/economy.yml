# Civilizations experimental economy settings (not final game balance).
# On a server: plugins/Civilizations/economy.yml
# Keep indentation: two spaces. Use numbers without quotes and % signs.
# Edit while stopped, then restart. This file is never overwritten automatically.
# Live food accounting uses planted fields and saved residents. Optional village
# food purchases and bargaining pay emeralds; barter exchanges real saved supplies.
# Starvation effects are not enabled.
format-version: 1

# /civ barter timber (or stone) requests a quote for the whole held food stack.
# /civ barter accept explicitly confirms it; saved inventory proof gates the exchange.
# Prototype outgoing goods use real saved opening supplies, not new industry production.
# Remove a goods entry to disallow it. Only timber/OAK_LOG and stone/COBBLESTONE supported.
# Whole items floor to current Trade Value; keep-units protects that commodity's stock.
# Food target 1..100 periods; maximum-items 1..64; units-per-item 1..1000000;
# keep-units 0..1000000000. Edit while stopped and restart.
barter:
  enabled: true
  food-reserve-periods: 3
  maximum-items: 64
  goods:
    timber:
      item: OAK_LOG
      units-per-item: 1
      keep-units: 2
    stone:
      item: COBBLESTONE
      units-per-item: 1
      keep-units: 2

# Players can ask a food price with /civ bargain <emeralds>, then /civ bargain accept.
# Each proposal uses current need/value/funds. Nothing exchanges until acceptance.
# Excessive prices receive counters; consecutive failed prices eventually close the deal.
# Closing/reopening menus or reconnecting cannot erase the saved village cooldown.
# No reputation penalty. Old files missing this section keep bargaining disabled.
# Attempts: 1..100; cooldown: 1..86400 seconds; offer validity: 1..3600 seconds.
# Edit while stopped, restart. Pending verified purchases still recover if disabled.
bargaining:
  enabled: true
  maximum-failed-offers: 3
  cooldown-seconds: 60
  offer-seconds: 45

# Basic family wellbeing, not money or a personal bank account. No population penalties.
# New people start at 50/100; families share the mean of their saved welfare scores.
# Their actual food/housing then changes that score. Moves retain the people's history.
# Recovery requires supplied food AND known sufficient housing. Unknown is not zero.
# Food crisis uses shortages.severe-after-periods; crowding adds its own penalty.
# All values: 0..100; crisis penalty must be at least shortage penalty.
# Existing residents' scores never reset on retuning, restart or migration.
# Old files without this section keep the assessment disabled; add it to opt in.
wellbeing:
  enabled: true
  starting-score: 50
  recovery-per-period: 1
  food-shortage-penalty: 3
  food-crisis-penalty: 5
  crowding-penalty: 1

# Starting spending capacity, NOT emerald items or individual salaries.
# New economies receive this amount per living resident ONCE. Enabling this on an
# existing server also opens accounts for active economies that have NO treasury.
# Existing accounts (even empty ones) never refill. Births/migration/restarts do not
# add grants. Disabling stops new grants; it does not erase existing money.
# 24 Trade Value is about six adult food periods at the default balanced food price.
# This is experimental initial capital, not ongoing business revenue.
# Valid amount: 0..1000000, at most two decimal places; 0 creates a recorded zero account.
# Old files without this entire section keep grants disabled. Add it to opt in.
finance:
  opening-funds-enabled: true
  opening-trade-value-per-resident: 24

# Village food purchases, separate from free donations. Sneak-right-click, then Sell.
# Ordinary vanilla trading is unchanged. Old files without this section keep sales off.
# Villages buy only when seeking food, with reliable reports and actual funds.
# Whole confirmed held stacks only: split a large stack if it exceeds remaining need.
# Payment replaces the consumed stack in the main-hand slot; never drops overflow.
# The market value rounds DOWN to whole emeralds. Only actual payment debits funds.
# Disabling new sales still permits pending-trade recovery at its original saved rate.
purchases:
  enabled: true
  trade-value-per-emerald: 8     # 0.01..1000000, up to two decimal places.
  food-reserve-periods: 3       # Buy toward this many demand periods (1..100).
  maximum-emeralds: 64          # Per whole-stack deal (1..64).

# Nonbinding priorities: seek food, investigate crowded homes, or monitor.
# Buying/building is not enabled. Review sooner if pressure appears, escalates or clears.
# These weights bias seeded choices among feasible, reasonably competitive priorities.
# Old files may omit this whole section. Edits apply to future reviews; history is retained.
priorities:
  # Earlier verified deliveries can mildly reinforce seeking food when it is still needed.
  # Both zero disables. Otherwise window 1..100; maximum bonus 1..100 percent.
  # Old files without learning stay disabled. No penalties, payment changes or player rewards.
  learning:
    window-periods: 12
    maximum-food-bonus-percent: 25
  review-after-periods: 5
  food-weight: 10
  crisis-multiplier: 3
  housing-weight: 6
  monitor-weight: 1
  minimum-relative-percent: 25

# Economic periods are separate from population months. Consumption below is PER PERIOD.
# Changing only the speed makes BOTH consumption and production happen more often.
pace:
  seconds-per-period: 60
  maximum-offline-periods: 120  # Catch-up cap; 0 = no offline economy catch-up.
  periods-per-batch: 2         # SQL-owner work budget, not a Paper tick deadline.

food:
  units-per-adult: 2
  units-per-child: 1
  units-per-worker: 4          # Only with an evidenced facility slot AND available adult labor.
  output-percent: 100          # 100 = normal; 25 = famine; 200 = feast; 0 = no output.

# Read-only crops on farmland near saved homes. These do not claim block ownership,
# harvest crops or grant building permission. Shared/ambiguous fields defer both towns.
# Older files may omit this whole section and receive these documented defaults.
farms:
  radius-blocks: 32
  vertical-radius-blocks: 16
  crops-per-worker: 16

# Coverage = (reserves + production + imports) / requested demand.
# Severe requires BOTH low coverage and this many consecutive deficit periods.
# Full supply clears the duration counter. No automatic starvation deaths are enabled.
shortages:
  severe-coverage-percent: 50
  severe-after-periods: 3
  surplus-coverage-percent: 125
  abundant-coverage-percent: 200

# Explicit first enrollment only. Never replenishes an existing inventory on restart.
# Abstract commodity units, not items removed from Minecraft chests.
# Food 12 gives a new adult about six periods of reserves without production.
starting-units-per-resident:
  food: 12
  timber: 4
  stone: 4
  iron: 1
  coal: 1
  livestock_products: 0

# Abstract Trade Value, converted to whole emeralds or available barter goods in offers.
# Prices can have up to two decimal places. Commodity keys must match stocks above.
prices:
  base-trade-value:
    food: 2
    timber: 4
    stone: 3
    iron: 12
    coal: 6
    livestock_products: 5
  condition-percent:
    severe-shortage: 250
    shortage: 150
    balanced: 100
    surplus: 85
    abundant: 70

# FAMINE EXAMPLE: output-percent: 25 (or units-per-adult: 3).
# FEAST EXAMPLE: output-percent: 200 (or units-per-adult: 1).
# Keep 100 for ordinary play until tuning. These examples need real production capacity;
# a multiplier cannot conjure farms. Whole food output rounds down each period.
# Restart tuning records a forward transition, skips the offline interval at that
# change, and preserves past explanations. Finish queued catch-up before retuning.

# Read-only /civ aid preview. No items are removed or payments/reputation awarded.
# Defaults apply to an existing format-1 file if this entire section is absent.
# Only these six ordinary plant foods are currently supported; omit a key to disable it.
# Whole food units per item, 1..1000000. Radius is 1..128 blocks in the same world.
aid-preview:
  enabled: true
  radius-blocks: 32
  units-per-item:
    WHEAT: 1
    BREAD: 3
    CARROT: 1
    POTATO: 1
    BAKED_POTATO: 2
    BEETROOT: 1

# Sneak-right-click a managed villager with plain food, then click Donate held food.
# No payment or reputation reward. Recovery receipts are verified in saved player data.
# Existing owner files without this section keep donations disabled until opted in.
donations:
  enabled: true
