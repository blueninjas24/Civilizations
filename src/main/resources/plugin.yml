name: Civilizations
version: '0.0.1'
main: com.blueninjas24.civilizations.Civilizations
api-version: '1.21'
softdepend: [WorldEdit]
author: Blueninjas24
description: Evolving, autonomous civilizations for Minecraft.
commands:
  civ:
    description: Civilizations construction previews, pen protection, village food aid, bargaining, livestock market and administrative diagnostics.
    usage: /civ market or /civ aid [settlement UUID] or /civ bargain <emeralds|accept> [settlement UUID] or /civ barter <timber|stone|accept> [settlement UUID] or /civ debug status | housing | construction | observation | villages | resources | workforce <uuid> | settlement <uuid> | explain <uuid> | economy <uuid> | businesses <uuid> | recover-ore | recover-forest
permissions:
  civilizations.building.reclaim:
    description: Preview and confirm withdrawal of village housing use from your own donated building, preserving residents and structure.
    default: true
  civilizations.building.donate:
    description: Review a selected single-family home and explicitly declare ownership to grant village-use permission; no occupied capacity or title transfer.
    default: true
  civilizations.building.renovate:
    description: Separately review and confirm renovation consent for your recorded donated building; never starts work or grants access to contents.
    default: true
  civilizations.building.protect:
    description: Preview and explicitly confirm your own off-limits building plot; never grants donation, animal adoption or block changes.
    default: true
  civilizations.building.admin:
    description: Review and release another player's saved building exclusion after confirmation.
    default: op
  civilizations.construction.preview:
    description: Inspect authored construction templates and read-only site previews; grants no block-changing permission.
    default: op
  civilizations.construction.manage:
    description: Preview and explicitly confirm cancellation of unused home projects only; cannot discard paid goods, started buildings or history.
    default: op
  civilizations.pen.admin:
    description: Explicitly resolve uncertain livestock pen ownership with preview and confirmation.
    default: op
  civilizations.pen.release:
    description: Release your own saved pen area after confirmation, retaining animal ownership and history.
    default: true
  civilizations.trade:
    description: Bargain and confirm village food sales and buy stocked livestock products.
    default: true
  civilizations.debug:
    description: Inspect Civilizations state and explicitly confirm scoped resource recovery.
    default: op
  civilizations.aid.preview:
    description: Preview held food for a nearby village without transferring items.
    default: true
  civilizations.aid.donate:
    description: Confirm food donations through the Civilizations village menu.
    default: true
