  - {role: bed, at: [4, 1, 1], facing: east}
  - {role: bed, at: [2, 1, 2], facing: west}
  - {role: bed, at: [4, 1, 2], facing: east}
  - {role: bed, at: [2, 1, 3], facing: west}
  - {role: bed, at: [4, 1, 3], facing: east}
  - {role: bed, at: [2, 1, 4], facing: west}
  - {role: bed, at: [4, 1, 4], facing: east}
